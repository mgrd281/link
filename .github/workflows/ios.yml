name: iOS

# macOS runners are billed per minute: run only when iOS code or tokens change (or manually).
on:
  pull_request:
    paths: ["apps/ios/**", "packages/tokens/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["apps/ios/**", "packages/tokens/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: SwiftLint · build · test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen swiftlint
      - name: SwiftLint (incl. token rules)
        working-directory: apps/ios
        run: swiftlint --strict
      - name: Design system tests (Swift Testing, iOS simulator)
        working-directory: apps/ios/Packages/LinkyoDesignSystem
        run: xcodebuild test -scheme LinkyoDesignSystem -destination 'platform=iOS Simulator,name=iPhone 16' -quiet
      - name: Generate project and build app + extensions
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild build -project Linkyo.xcodeproj -scheme Linkyo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
