name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Generated iOS tokens are up to date
        run: pnpm check:tokens-drift
      - name: Lint (ESLint + Stylelint + token guard incl. Swift)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (tokens, contrast guard, lint rules, blocks, editor)
        run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E + accessibility (axe, WCAG 2.2 AA)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linkyo/web... build
      - run: pnpm --filter @linkyo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @linkyo/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (creator pages)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linkyo/web... build
      - run: pnpm --filter @linkyo/web exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          retention-days: 14
