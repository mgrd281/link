<!doctype html>

<head>
<meta charset="utf-8">
<!--
  Linkyo original motion graphic, version 2: a reach-truck driver (Schubmaststapler) scans a pallet,
  lifts it, reaches it into a high rack, a check confirms it, the truck backs out and returns with the
  next pallet. Black, graphite and silver. Drawn from scratch in SVG; render(t) is a pure function of
  time, so frames are exact and the 12 s loop is seamless (the last frame equals the first). No text.
  The camera keeps the action inside the centre 75 % of the width, which phones show.
-->

  html, body { margin: 0; background: #0a0a0b; }
  svg { display: block; width: 1080px; height: 1350px; }
</style>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const T = 18;
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const inn = (x) => { x = clamp(x); return x * x * x; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { x = clamp(x); const c = 2.70158; return 1 + c * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };

(() => {
  const g = $("farRacks");
  const add = (tag, attrs, parent = g) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  for (let i = -1; i < 13; i++) {
    const x = i * 230 + 30;
    add("rect", { x, y: 300, width: 12, height: 700, fill: "#1c1c1f" });
    add("rect", { x: x + 150, y: 300, width: 12, height: 700, fill: "#1c1c1f" });
    for (const y of [460, 640, 820]) add("rect", { x: x - 6, y, width: 180, height: 8, fill: "#232326" });
    for (const [y, on] of [[460, i % 2 === 0], [640, i % 3 !== 1], [820, true], [1000, i % 2 === 1]]) {
      if (!on) continue;
      add("rect", { x: x + 18, y: y - 92, width: 126, height: 88, rx: 4, fill: "#1f1f22" });
      add("rect", { x: x + 14, y: y - 8, width: 134, height: 8, fill: "#1a1a1c" });
    }
  }
  const lane = $("lane");
  for (let i = -3; i < 28; i++) add("rect", { x: i * 110, y: 1074, width: 64, height: 8, rx: 4 }, lane);
  const dust = $("dust");
  for (let i = 0; i < 34; i++) {
    const cone = i % 2 ? [240, 640] : [660, 640];
    const c = add("circle", { r: 1.2 + (i % 3) * 0.7 }, dust);
    c.dataset.x = cone[0] + Math.sin(i * 12.9898) * 120; c.dataset.y = 160 + ((i * 97) % 780);
  }
})();

/*
 * Timeline (s): 0-0.6 hold · 0.6-2.2 scan the label · 2.2-4.2 lift to level 2 · 4.2-5.4 reach in ·
 * 5.4-5.8 set down · 5.7-7.0 check · 5.9-7.1 reach back · 7.1-8.3 forks down · 8.3-10.8 drive to the
 * loading dock (the camera tracks) · 10.8-11.8 reach into the trailer · 11.8-12.2 pick the pallet up ·
 * 12.2-13.2 reach back with it · 13.4-16.6 reverse to the rack · 16.6-18 settle where it started.
 * The stored pallet leaves the rack while the camera is at the dock (the rack is out of view).
 */
const LIFT = 200, SET = 24, REACH = 272, DOCK = 960, DEEP = 330, PICK = 16;
function truckX(t) {
  if (t < 8.3) return 0;
  if (t < 10.8) return DOCK * ease(seg(t, 8.3, 10.8));
  if (t < 13.4) return DOCK;
  if (t < 16.6) return DOCK * (1 - ease(seg(t, 13.4, 16.6)));
  return 0;
}
function lift(t) {
  if (t < 2.2) return 0;
  if (t < 4.2) return LIFT * ease(seg(t, 2.2, 4.2));
  if (t < 5.4) return LIFT;
  if (t < 5.8) return LIFT - SET * ease(seg(t, 5.4, 5.8));
  if (t < 7.1) return LIFT - SET;
  if (t < 8.3) return (LIFT - SET) * (1 - ease(seg(t, 7.1, 8.3)));
  if (t < 11.8) return 0;
  if (t < 12.2) return PICK * ease(seg(t, 11.8, 12.2));
  if (t < 16.6) return PICK;
  return PICK * (1 - ease(seg(t, 16.6, 17.4)));
}
function reach(t) {
  if (t < 4.2) return 0;
  if (t < 5.4) return REACH * ease(seg(t, 4.2, 5.4));
  if (t < 5.9) return REACH;
  if (t < 7.1) return REACH * (1 - ease(seg(t, 5.9, 7.1)));
  if (t < 10.8) return 0;
  if (t < 11.8) return DEEP * ease(seg(t, 10.8, 11.8));
  if (t < 12.2) return DEEP;
  if (t < 13.2) return DEEP * (1 - ease(seg(t, 12.2, 13.2)));
  return 0;
}
// Camera keyframes [t, focusX, focusY, zoom]: phone-safe framing; a tracking shot to the dock and back.
const K = [[0, 545, 800, 1.04], [0.6, 545, 800, 1.04], [2.2, 585, 830, 1.12], [4.2, 640, 720, 1.08], [5.9, 790, 700, 1.14], [7.1, 690, 760, 1.08], [8.3, 600, 800, 1.02], [10.8, 1580, 800, 1.0], [12.2, 1700, 840, 1.08], [13.4, 1580, 800, 1.0], [16.6, 560, 800, 1.02], [17.4, 545, 800, 1.04], [18, 545, 800, 1.04]];
function camera(t) {
  let k = 0; while (k < K.length - 2 && t > K[k + 1][0]) k++;
  const [t0, x0, y0, z0] = K[k], [t1, x1, y1, z1] = K[k + 1];
  const f = (1 - Math.cos(Math.PI * clamp((t - t0) / (t1 - t0)))) / 2;
  return { cx: x0 + (x1 - x0) * f, cy: y0 + (y1 - y0) * f, zoom: z0 + (z1 - z0) * f };
}
function render(t) {
  t = ((t % T) + T) % T;
  const x = truckX(t), l = lift(t), r = reach(t);
  const dt = 1 / 60;
  const v = (truckX(t + dt) - truckX(t - dt)) / (2 * dt);
  const moving = clamp(Math.abs(v) / 240);
  const bob = Math.sin(t * 26) * 1.6 * moving;
  $("truck").setAttribute("transform", `translate(${x} ${bob})`);
  $("wheel").setAttribute("transform", `translate(0 ${-bob}) rotate(${(x / 50) * 57.3} 250 950)`);
  $("loadWheel").setAttribute("transform", `translate(0 ${-bob}) rotate(${(x / 20) * 57.3} 696 980)`);
  $("reach").setAttribute("transform", `translate(${r} 0)`);
  $("carriage").setAttribute("transform", `translate(0 ${-l})`);
  const carriageTop = 790 - l;
  const innerTop = Math.min(620, carriageTop - 24);
  $("innerMast").setAttribute("y", innerTop);
  $("innerMast").setAttribute("height", 960 - innerTop);
  $("chain").setAttribute("y1", innerTop + 4);
  $("chain").setAttribute("y2", carriageTop + 6);
  // The load: on the forks, then on the beam (bottom 760), then it flows out the back.
  const m = $("moving");
  const forkTop = 950 - l;
  const onForks = { x: 524 + r + x, y: forkTop + bob };
  if (t < 5.6) { m.setAttribute("x", onForks.x); m.setAttribute("y", Math.min(onForks.y, t > 5.4 ? 760 : onForks.y)); m.setAttribute("opacity", 1); }
  else if (t < 11) { m.setAttribute("x", 524 + REACH); m.setAttribute("y", 760); m.setAttribute("opacity", 1); }
  else if (t < 11.8) { m.setAttribute("opacity", 0); }
  else { m.setAttribute("x", onForks.x); m.setAttribute("y", onForks.y); m.setAttribute("opacity", 1); }
  $("trailerLoad").setAttribute("opacity", t >= 11.8 ? 0 : 1);
  // Scan: from the scanner on the front post (truck coords 468,696) to the label (load x+128..198, y-90..-50).
  const scanOn = seg(t, 0.75, 0.95) * (1 - seg(t, 2.0, 2.2));
  const sweep = ease(seg(t, 0.95, 1.9));
  const lx = onForks.x + 128, ly = onForks.y - 90;
  const sy = ly + 4 + sweep * 32;
  $("scan").setAttribute("opacity", scanOn);
  $("scanFan").setAttribute("points", `${468 + x},${696 + bob} ${lx},${sy - 2} ${lx},${sy + 2} ${lx + 70},${sy + 2} ${lx + 70},${sy - 2}`);
  for (const id of ["scanLine", "scanCore"]) { const e = $(id); e.setAttribute("x1", lx - 4); e.setAttribute("x2", lx + 74); e.setAttribute("y1", sy); e.setAttribute("y2", sy); }
  const flash = seg(t, 1.9, 2.0) * (1 - seg(t, 2.0, 2.35));
  const lf = $("labelFlash"); lf.setAttribute("x", lx); lf.setAttribute("y", ly); lf.setAttribute("opacity", 0.75 * flash);
  $("scanEye").setAttribute("fill", scanOn > 0.1 ? "#ffffff" : "#3d3e43");
  $("scanDot").setAttribute("cx", 466 + x); $("scanDot").setAttribute("cy", 696 + bob);
  // Driver looks at the label, then up while lifting and storing.
  const look = t > 2.2 && t < 7.4 ? -14 * ease(seg(t, 2.2, 3.0)) * (1 - ease(seg(t, 6.6, 7.4))) : t > 0.6 && t < 2.2 ? 6 * ease(seg(t, 0.6, 1.0)) * (1 - ease(seg(t, 1.9, 2.2))) : 0;
  $("head").setAttribute("transform", `rotate(${look} 324 704)`);
  const blink = (Math.sin(t * Math.PI * 2 * 1.5) + 1) / 2;
  $("beacon").setAttribute("fill", blink > 0.5 ? "#ffffff" : "#9a9ca2");
  $("beaconHalo").setAttribute("opacity", 0.2 + 0.5 * blink);
  $("beaconHalo").setAttribute("cx", 349);
  const spot = $("spotLight");
  spot.setAttribute("cx", (v >= 0 ? 860 : -60) + x);
  spot.setAttribute("opacity", 0.85 * moving);
  const show = seg(t, 5.7, 6.1) * (1 - seg(t, 6.8, 7.2));
  $("check").setAttribute("opacity", show);
  $("check").setAttribute("transform", `translate(1040 690) scale(${0.6 + 0.4 * back(seg(t, 5.7, 6.1))})`);
  const { cx, cy, zoom } = camera(t);
  $("cam").setAttribute("transform", `translate(${540 - cx * zoom} ${600 - cy * zoom}) scale(${zoom})`);
  $("far").setAttribute("transform", `translate(${(cx - 545) * 0.35} ${(cy - 800) * 0.25})`);
  $("fore").setAttribute("transform", `translate(${-(cx - 545) * 0.5} 0)`);
  const dust = $("dust").children;
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i], ph = i * 2.399, a = (t / T) * Math.PI * 2;
    d.setAttribute("cx", Number(d.dataset.x) + Math.sin(a + ph) * 16);
    d.setAttribute("cy", Number(d.dataset.y) + Math.cos(a * (i % 2 ? 1 : 2) + ph) * 22);
    d.setAttribute("opacity", 0.12 + 0.18 * (Math.sin(a * 2 + ph) + 1) / 2);
  }
}
window.render = render;
render(0);
</script>
